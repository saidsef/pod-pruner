apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-pruner
  labels:
    app.kubernetes.net/name: pod-pruner
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'delete']
  - apiGroups: ['batch']
    resources: ['jobs']
    verbs: ['get', 'list', 'delete']
