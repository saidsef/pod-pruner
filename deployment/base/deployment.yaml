apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: pod-pruner
  name: pod-pruner
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pod-pruner
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-pruner
      annotations:
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
                      - arm64
      containers:
        - env:
            # Remove NAMESPACES to sweep every namespace in the cluster.
            - name: NAMESPACES
              value: 'argocd'
            - name: CONTAINER_STATUSES
              value: 'Error,ContainerStatusUnknown,Unknown,Completed'
            - name: RESOURCES
              value: 'PODS,JOBS'
          image: 'ghcr.io/saidsef/pod-pruner:latest'
          imagePullPolicy: Always
          name: pod-pruner
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 10m
              memory: 20Mi
            requests:
              cpu: 5m
              memory: 10Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
      dnsPolicy: ClusterFirst
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: pod-pruner
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: amd64
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
